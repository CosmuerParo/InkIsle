<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title">
  <title id="title">在博客里嵌入 JavaScript</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2c25"/>
      <stop offset="1" stop-color="#0e1511"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9b95c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e9b95c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#e9b95c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#dce6cc" stroke-opacity=".055"/>
    </pattern>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#ffffff" opacity=".08"/>
      <circle cx="4" cy="3" r=".4" fill="#000000" opacity=".18"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1290" cy="220" r="290" fill="#d9893f" opacity=".13" filter="url(#glow)"/>
  <path d="M0 720 C260 670 400 760 620 720 C880 671 1050 580 1290 650 C1430 690 1520 700 1600 670" fill="none" stroke="url(#beam)" stroke-width="2"/>
  <g transform="translate(110 180)">
    <rect width="900" height="590" rx="14" fill="#131a15" stroke="#dce6cc" stroke-opacity=".14"/>
    <path d="M0 46 H900" stroke="#dce6cc" stroke-opacity=".1"/>
    <circle cx="30" cy="23" r="5" fill="#c65a3f"/>
    <circle cx="50" cy="23" r="5" fill="#c49a45"/>
    <circle cx="70" cy="23" r="5" fill="#6f8e71"/>
    <text x="760" y="28" font-family="monospace" font-size="13" fill="#dce6cc" opacity=".35">article.js</text>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="21" fill="#d8dfcf">
      <text x="45" y="105"><tspan fill="#7e9481">const</tspan> panel = document.<tspan fill="#e2b76b">getElementById</tspan>(</text>
      <text x="45" y="139" fill="#d9a47e">'js-live-demo'</text>
      <text x="45" y="173">);</text>
      <text x="45" y="230" fill="#7e9481">if</text>
      <text x="93" y="230">(!panel) </text>
      <text x="205" y="230" fill="#e2b76b">return</text>
      <text x="45" y="287">panel.<tspan fill="#b7c9a8">addEventListener</tspan>(</text>
      <text x="45" y="321" fill="#d9a47e">'click'</text>
      <text x="160" y="321">, () =&gt; {</text>
      <text x="85" y="378">panel.style.setProperty(</text>
      <text x="85" y="412" fill="#d9a47e">'--glow'</text>
      <text x="260" y="412">, </text>
      <text x="280" y="412" fill="#e2b76b">0.8</text>
      <text x="330" y="412">);</text>
      <text x="45" y="469">});</text>
      <text x="45" y="526" fill="#7e9481">// 让文字动起来</text>
    </g>
    <rect x="597" y="728" width="0" height="0"/>
  </g>
  <g transform="translate(1090 560)">
    <circle r="118" fill="#e9b95c" opacity=".1"/>
    <circle r="92" fill="none" stroke="#e9b95c" stroke-opacity=".4"/>
    <text x="0" y="40" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="100" fill="#e9b95c" opacity=".9">JS</text>
  </g>
  <text x="110" y="875" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="54" fill="#e6ddca">让一篇文章，可以动手试一试。</text>
  <text x="112" y="925" font-family="monospace" font-size="15" letter-spacing="6" fill="#dce6cc" opacity=".4">INTERACTIVE STORYTELLING</text>
  <rect width="1600" height="1000" fill="url(#grain)"/>
</svg>
