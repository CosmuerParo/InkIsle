<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title">
  <title id="title">岛屿书单</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d3d33"/>
      <stop offset="1" stop-color="#3b211d"/>
    </linearGradient>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#fff" opacity=".06"/>
      <circle cx="3" cy="3" r=".5" fill="#000" opacity=".18"/>
    </pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#1d0f0c" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1300" cy="160" r="240" fill="#d49a71" opacity=".14"/>
  <circle cx="1300" cy="160" r="170" fill="none" stroke="#f1d7bd" stroke-opacity=".2"/>
  <g transform="translate(210 640) rotate(-4)" filter="url(#shadow)">
    <rect width="840" height="120" rx="4" fill="#d9c3a4"/>
    <rect x="35" y="22" width="540" height="12" fill="#6d3d33" opacity=".55"/>
    <rect x="35" y="48" width="390" height="7" fill="#6d3d33" opacity=".3"/>
    <text x="795" y="82" text-anchor="end" font-family="'Noto Serif SC', serif" font-size="34" fill="#4a2b23">岛屿书单</text>
  </g>
  <g transform="translate(250 530) rotate(2)" filter="url(#shadow)">
    <rect width="760" height="110" rx="4" fill="#efe2cb"/>
    <rect x="35" y="24" width="460" height="10" fill="#7c5c43" opacity=".45"/>
    <text x="720" y="75" text-anchor="end" font-family="'Noto Serif SC', serif" font-size="27" fill="#8a5d47">READING NOTES</text>
  </g>
  <g transform="translate(310 430) rotate(-2)" filter="url(#shadow)">
    <rect width="680" height="100" rx="4" fill="#b86b50"/>
    <rect x="32" y="22" width="400" height="9" fill="#f5e7d3" opacity=".55"/>
    <text x="645" y="67" text-anchor="end" font-family="'Noto Serif SC', serif" font-size="24" fill="#f6e8d2">最近读过的五本书</text>
  </g>
  <g fill="#f3e5d1" opacity=".7">
    <circle cx="1270" cy="680" r="2"/>
    <circle cx="1320" cy="720" r="1.5"/>
    <circle cx="1220" cy="750" r="2.5"/>
  </g>
  <text x="210" y="220" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="150" fill="#f3e5d1" opacity=".9">读</text>
  <text x="225" y="290" font-family="monospace" font-size="16" letter-spacing="10" fill="#e5b89a" opacity=".7">BOOKS ON THE ISLAND</text>
  <text x="1220" y="860" font-family="'Noto Serif SC', serif" font-size="30" fill="#f3e5d1" opacity=".55">字里行间，另有一座岛。</text>
  <rect width="1600" height="1000" fill="url(#grain)"/>
</svg>
