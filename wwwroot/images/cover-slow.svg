<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title">
  <title id="title">在文字的岛屿上，慢一点</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6d9c2"/>
      <stop offset=".55" stop-color="#c9b69a"/>
      <stop offset="1" stop-color="#8e785f"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e9b28f"/>
      <stop offset="1" stop-color="#b45f43"/>
    </radialGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#ffffff" opacity=".11"/>
      <circle cx="3" cy="2.4" r=".5" fill="#2b241a" opacity=".08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1160" cy="300" r="188" fill="url(#sun)" opacity=".9"/>
  <circle cx="1160" cy="300" r="255" fill="none" stroke="#f4e8d7" stroke-opacity=".33" stroke-width="1.5"/>
  <circle cx="1160" cy="300" r="320" fill="none" stroke="#f4e8d7" stroke-opacity=".14" stroke-width="1"/>
  <path d="M0 700 C260 620 420 730 650 682 C875 636 995 532 1220 598 C1375 644 1480 700 1600 675 V1000 H0Z" fill="#5d6657" opacity=".78"/>
  <path d="M0 790 C220 710 400 810 640 760 C870 713 1040 660 1280 730 C1420 770 1510 790 1600 770 V1000 H0Z" fill="#3c493d" opacity=".85"/>
  <path d="M0 900 C270 850 520 900 760 880 C1040 857 1240 830 1600 890 V1000 H0Z" fill="#242e27"/>
  <g fill="#f2e5d1" opacity=".2" font-family="Georgia, 'Noto Serif SC', serif">
    <text x="95" y="120" font-size="21" letter-spacing="12">A QUIET PLACE FOR IDEAS</text>
  </g>
  <g fill="none" stroke="#f2e5d1" stroke-opacity=".18">
    <path d="M100 210 H420"/>
    <path d="M100 225 H300"/>
  </g>
  <text x="92" y="640" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="250" fill="#f2e5d1" opacity=".92">慢</text>
  <text x="1180" y="860" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="42" fill="#f2e5d1" opacity=".7" letter-spacing="16">岛屿来信</text>
  <g transform="translate(1330 790)">
    <rect width="112" height="112" rx="4" fill="none" stroke="#e3a78d" stroke-width="2"/>
    <text x="56" y="78" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="50" fill="#e3a78d">屿</text>
  </g>
  <rect width="1600" height="1000" fill="url(#grain)"/>
</svg>
