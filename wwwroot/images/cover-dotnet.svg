<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title">
  <title id="title">用 .NET 8 与 SQLite 搭建博客</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22323a"/>
      <stop offset="1" stop-color="#101b20"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab5c0"/>
      <stop offset="1" stop-color="#5b7f8b"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#d4e3e6" stroke-opacity=".055"/>
    </pattern>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#fff" opacity=".07"/>
      <circle cx="3" cy="2" r=".5" fill="#000" opacity=".15"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1180" cy="470" r="300" fill="none" stroke="url(#ring)" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="1180" cy="470" r="220" fill="none" stroke="#d4e3e6" stroke-opacity=".12"/>
  <circle cx="1180" cy="470" r="140" fill="none" stroke="#d4e3e6" stroke-opacity=".16"/>
  <circle cx="1180" cy="170" r="8" fill="#c65a3f"/>
  <circle cx="1380" cy="470" r="5" fill="#8ab5c0"/>
  <circle cx="1180" cy="770" r="5" fill="#8ab5c0"/>
  <g transform="translate(108 170)">
    <rect width="720" height="560" rx="12" fill="#152329" stroke="#d4e3e6" stroke-opacity=".13"/>
    <text x="40" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#8ab5c0">Program.cs</text>
    <path d="M40 92 H680" stroke="#d4e3e6" stroke-opacity=".1"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="19" fill="#d5dfdc">
      <text x="40" y="148"><tspan fill="#d9a47e">builder</tspan>.Services.<tspan fill="#e3c47c">AddRazorComponents</tspan>()</text>
      <text x="76" y="181">.<tspan fill="#e3c47c">AddInteractiveServerComponents</tspan>();</text>
      <text x="40" y="239"><tspan fill="#d9a47e">builder</tspan>.Services.<tspan fill="#e3c47c">AddDbContextFactory</tspan>(</text>
      <text x="76" y="272">options =&gt; options.<tspan fill="#e3c47c">UseSqlite</tspan>(</text>
      <text x="112" y="305" fill="#9dbfae">"Data Source=App_Data/inkisle.db"</text>
      <text x="76" y="338">));</text>
      <text x="40" y="396"><tspan fill="#7e9481">app</tspan>.<tspan fill="#e3c47c">MapRazorComponents</tspan>&lt;App&gt;()</text>
      <text x="76" y="429">.<tspan fill="#e3c47c">AddInteractiveServerRenderMode</tspan>();</text>
    </g>
  </g>
  <g transform="translate(1240 620)">
    <rect width="195" height="195" rx="99" fill="#1b2d34" stroke="#8ab5c0" stroke-opacity=".5"/>
    <text x="97" y="105" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="58" fill="#e3ece9">.NET</text>
    <text x="97" y="145" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="4" fill="#8ab5c0">8.0</text>
  </g>
  <text x="108" y="838" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="58" fill="#e5ebe4">把复杂留给自己，把安静留给读者。</text>
  <text x="110" y="894" font-family="monospace" font-size="15" letter-spacing="6" fill="#8ab5c0" opacity=".65">BLAZOR · EF CORE · SQLITE</text>
  <rect width="1600" height="1000" fill="url(#grain)"/>
</svg>
